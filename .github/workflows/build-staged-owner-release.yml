name: Build staged owner release tool without running it
on:
  push:
    branches: ['diagnostics/tablet-owner-readonly']
    paths: ['diagnostics/ApprovedOwnerRelease.java', '.github/workflows/build-staged-owner-release.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile guarded stage-one tool only
        run: |
          set -euo pipefail
          mkdir -p release-classes release-output
          javac --release 8 -d release-classes diagnostics/ApprovedOwnerRelease.java
          jar cf release-input.jar -C release-classes .
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/d8" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 33 --output release-output/tablet-owner-release.jar release-input.jar
          sha256sum release-output/tablet-owner-release.jar
      - uses: actions/upload-artifact@v4
        with:
          name: staged-owner-release
          path: release-output/tablet-owner-release.jar
          if-no-files-found: error
