name: Verify migrated tablet update channel
on:
  push:
    branches: [main, fix/tablet-signing-migration-audit]
    paths:
      - 'updates/**'
      - 'android/signing_certificate.sha256'
      - 'android/verify_update_channel.py'
      - '.github/workflows/verify-tablet-update-channel.yml'
      - '.github/workflows/build-android-apk.yml'
  pull_request:
    paths:
      - 'updates/**'
      - 'android/signing_certificate.sha256'
      - 'android/verify_update_channel.py'
      - '.github/workflows/verify-tablet-update-channel.yml'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android verification tools
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
      - name: Validate the published channel
        run: python3 android/verify_update_channel.py
      - name: Confirm rejection of old-signature APK
        run: |
          set -euo pipefail
          git show b793f652a31e4d43b68b04803df1f2906cf02bcf:updates/simple-store-tablet.apk > "$RUNNER_TEMP/old-signature.apk"
          if python3 android/verify_update_channel.py --apk "$RUNNER_TEMP/old-signature.apk"; then
            echo '::error::Old-signature APK was unexpectedly accepted'
            exit 1
          fi
          echo 'Old-generation certificate correctly rejected'
