name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable Android signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: simple-store-android-signing-key-v1

      - name: Create signing key once
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Simple Store Tablet,O=Simple Store,C=IL"

      - name: Add native admin enhancements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/java/com/simplestore/tablet/MainActivity.java')
          text = path.read_text(encoding='utf-8')

          marker = '        Button logout=button("יציאה מניהול",red,Color.WHITE);'
          button = '        Button update=button("בדוק עדכון אפליקציה",green,Color.WHITE);update.setOnClickListener(v->AppUpdater.checkForUpdate(this));LinearLayout.LayoutParams up=new LinearLayout.LayoutParams(-1,dp(60));up.setMargins(0,0,0,dp(12));content.addView(update,up);\n'
          if 'בדוק עדכון אפליקציה' not in text:
              if marker not in text:
                  raise SystemExit('Admin update button marker not found')
              text = text.replace(marker, button + marker, 1)

          old_cat = '        for(Category c:categories){LinearLayout row=card();row.setOrientation(LinearLayout.HORIZONTAL);row.setGravity(Gravity.CENTER_VERTICAL);TextView t=text(c.name+"   "+("custom".equals(c.imageMode)?"תמונה מותאמת":"תמונות אוטומטיות"),18,true);row.addView(t,new LinearLayout.LayoutParams(0,dp(64),1));Button e=button("עריכה",blue,Color.WHITE);e.setOnClickListener(v->categoryDialog(c));row.addView(e,new LinearLayout.LayoutParams(dp(110),dp(52)));content.addView(row);}'
          new_cat = '''        for(Category c:categories){
            LinearLayout row=card();row.setOrientation(LinearLayout.HORIZONTAL);row.setGravity(Gravity.CENTER_VERTICAL);
            int productCount=0;for(Product p:products)if(p.categoryId.equals(c.id))productCount++;
            TextView t=text(c.name+"   ("+productCount+" מוצרים)\\n"+("custom".equals(c.imageMode)?"תמונה מותאמת":"תמונות אוטומטיות"),18,true);row.addView(t,new LinearLayout.LayoutParams(0,dp(74),1));
            Button up=button("↑",Color.rgb(237,241,247),blue);up.setOnClickListener(v->moveCategory(c,-1));row.addView(up,new LinearLayout.LayoutParams(dp(58),dp(52)));
            Button down=button("↓",Color.rgb(237,241,247),blue);down.setOnClickListener(v->moveCategory(c,1));row.addView(down,new LinearLayout.LayoutParams(dp(58),dp(52)));
            Button e=button("עריכה",blue,Color.WHITE);e.setOnClickListener(v->categoryDialog(c));row.addView(e,new LinearLayout.LayoutParams(dp(110),dp(52)));content.addView(row);
        }'''
          if old_cat in text:
              text = text.replace(old_cat, new_cat, 1)

          old_prod = '                Button e=button("עריכה",blue,Color.WHITE);e.setOnClickListener(v->productDialog(p));row.addView(e,new LinearLayout.LayoutParams(dp(110),dp(52)));content.addView(row);'
          new_prod = '''                Button up=button("↑",Color.rgb(237,241,247),blue);up.setOnClickListener(v->moveProduct(p,-1));row.addView(up,new LinearLayout.LayoutParams(dp(56),dp(52)));
                Button down=button("↓",Color.rgb(237,241,247),blue);down.setOnClickListener(v->moveProduct(p,1));row.addView(down,new LinearLayout.LayoutParams(dp(56),dp(52)));
                Button e=button("עריכה",blue,Color.WHITE);e.setOnClickListener(v->productDialog(p));row.addView(e,new LinearLayout.LayoutParams(dp(110),dp(52)));content.addView(row);'''
          if old_prod in text:
              text = text.replace(old_prod, new_prod, 1)

          helper_marker = '    private void showStockAdmin(){'
          helpers = '''    private void moveCategory(Category c,int direction){
        int i=categories.indexOf(c),j=i+direction;if(i<0||j<0||j>=categories.size())return;Category other=categories.get(j);
        int a=c.sortOrder,b=other.sortOrder;if(a==b){a=i+1;b=j+1;}
        final int ca=b,ob=a;
        io.execute(()->{try{JSONObject x=new JSONObject();x.put("sort_order",ca);requestRaw("PATCH","/rest/v1/categories?id=eq."+url(c.id),x,true);JSONObject y=new JSONObject();y.put("sort_order",ob);requestRaw("PATCH","/rest/v1/categories?id=eq."+url(other.id),y,true);loadData(this::showCategoriesAdmin);}catch(Exception e){main.post(()->Toast.makeText(this,"שינוי סדר קטגוריות נכשל: "+safeMsg(e),Toast.LENGTH_LONG).show());}});
    }

    private void moveProduct(Product p,int direction){
        List<Product> same=new ArrayList<>();for(Product x:products)if(x.categoryId.equals(p.categoryId))same.add(x);int i=same.indexOf(p),j=i+direction;if(i<0||j<0||j>=same.size())return;Product other=same.get(j);
        int a=p.sortOrder,b=other.sortOrder;if(a==b){a=i+1;b=j+1;}
        final int pa=b,ob=a;
        io.execute(()->{try{JSONObject x=new JSONObject();x.put("sort_order",pa);requestRaw("PATCH","/rest/v1/products?id=eq."+url(p.id),x,true);JSONObject y=new JSONObject();y.put("sort_order",ob);requestRaw("PATCH","/rest/v1/products?id=eq."+url(other.id),y,true);loadData(this::showProductsAdmin);}catch(Exception e){main.post(()->Toast.makeText(this,"שינוי סדר מוצרים נכשל: "+safeMsg(e),Toast.LENGTH_LONG).show());}});
    }

'''
          if 'private void moveCategory(Category c,int direction)' not in text:
              if helper_marker not in text:
                  raise SystemExit('Admin helper marker not found')
              text = text.replace(helper_marker, helpers + helper_marker, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-store-tablet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish in-app update
        run: |
          mkdir -p updates
          cp android/app/build/outputs/apk/debug/app-debug.apk updates/simple-store-tablet.apk
          python3 - <<'PY'
          import json, os
          data = {
              'versionCode': int(os.environ['GITHUB_RUN_NUMBER']),
              'versionName': '1.0.' + os.environ['GITHUB_RUN_NUMBER'],
              'apkUrl': 'https://raw.githubusercontent.com/ms0583212599-debug/simple-store-app/main/updates/simple-store-tablet.apk'
          }
          with open('updates/version.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, separators=(',', ':'))
              f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/simple-store-tablet.apk updates/version.json
          if git diff --cached --quiet; then
            echo "No update files changed"
            exit 0
          fi
          git commit -m "Publish Android update ${GITHUB_RUN_NUMBER}"
          git push
