name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/scripts/ci_home_sales.py'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-update-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore stable Android signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: simple-store-android-signing-key-v1
      - name: Create signing key once
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Simple Store Tablet,O=Simple Store,C=IL"
      - name: Add native admin enhancements
        run: python3 android/ci_enhance.py
      - name: Add native website parity features
        run: python3 android/ci_parity.py
      - name: Add live product search
        run: python3 android/ci_live_product_search.py
      - name: Compact storefront cards and improve images
        run: python3 android/ci_compact_storefront.py
      - name: Make storefront responsive
        run: python3 android/ci_responsive_storefront.py
      - name: Make storefront tiles smaller and clearer
        working-directory: android
        run: python3 ci_storefront_tiny_tiles.py
      - name: Rebuild category tiles with contained images
        working-directory: android
        run: python3 ci_category_tiles.py
      - name: Cache storefront images automatically
        working-directory: android
        run: python3 ci_image_cache.py
      - name: Allow purchase product name editing
        run: python3 android/ci_purchase_product_name.py
      - name: Add purchase customer visibility
        run: python3 android/ci_purchase_visibility.py
      - name: Add latest admin parity release
        run: python3 android/ci_latest_admin_parity.py
      - name: Add customer product management mode
        run: python3 android/ci_customer_admin_mode.py
      - name: Add shared Nedarim Plus settings
        run: python3 android/ci_nedarim_settings.py
      - name: Add saved-card payment option
        run: python3 android/ci_saved_card_payment.py
      - name: Add payment confirmation bridge
        run: python3 android/ci_payment_confirmation.py
      - name: Add app-only keyboard
        run: python3 android/ci_app_keyboard.py
      - name: Apply Nedarim-style customer storefront
        run: python3 android/ci_nedarim_storefront.py
      - name: Add live mini cart
        run: python3 android/ci_mini_cart.py
      - name: Apply Nedarim-style payment screen
        run: python3 android/ci_nedarim_payment_screen.py
      - name: Apply requested checkout and search bundle
        run: python3 android/ci_requested_checkout_search_bundle.py
      - name: Refine customer search to Nedarim geometry
        run: python3 android/ci_nedarim_search_precision.py
      - name: Refine payment screen to Nedarim geometry
        run: python3 android/ci_nedarim_payment_precision.py
      - name: Add home-use and special-sales admin
        run: python3 .github/scripts/ci_home_sales.py
      - name: Add optional home stock deduction
        working-directory: android
        run: python3 ci_home_save_mode.py
      - name: Add inventory draft controls
        working-directory: android
        run: python3 ci_inventory_draft_button.py
      - name: Add inventory count editing
        working-directory: android
        run: python3 ci_inventory_count_edit.py
      - name: Add cloud inventory count history
        working-directory: android
        run: python3 ci_inventory_cloud_history.py
      - name: Add store-admin-only kiosk release
        run: python3 android/ci_kiosk_admin_release.py
      - name: Check for updates automatically on launch
        working-directory: android
        run: python3 ci_auto_update_check.py
      - name: Add filtered-network updater fallback
        run: python3 android/ci_updater_text_fallback.py
      - name: Fix product visibility model
        run: python3 android/ci_fix_product_visibility_model.py
      - name: Add all-products and general amount checkout
        run: python3 android/ci_customer_all_products_general_amount.py
      - name: Make product and inventory writes cloud-first
        run: python3 android/ci_cloud_first_product_sync.py
      - name: Apply checkout keypad success screen and vertical mini cart
        run: python3 android/ci_checkout_keyboard_success_cart.py
      - name: Add collapsible mini cart
        run: python3 android/ci_collapsible_mini_cart.py
      - name: Add magnetic card reader payment mode
        run: python3 android/ci_card_reader_payment.py
      - name: Validate production Android invariants
        run: python3 android/ci_validate_release.py
      - name: Choose Android version
        id: version
        shell: bash
        run: |
          PUBLISHED=$(python3 - <<'PY'
          import json
          try:
              with open('updates/version.json', encoding='utf-8') as f:
                  print(int(json.load(f).get('versionCode', 0)))
          except Exception:
              print(0)
          PY
          )
          BASELINE=10000
          VERSION=$(( PUBLISHED + 1 ))
          if (( VERSION < BASELINE )); then VERSION=$BASELINE; fi
          if (( GITHUB_RUN_NUMBER > VERSION )); then VERSION=$GITHUB_RUN_NUMBER; fi
          echo "code=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing Android version $VERSION (previous $PUBLISHED, kiosk-safe baseline $BASELINE, run $GITHUB_RUN_NUMBER)"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug -PversionCode=${{ steps.version.outputs.code }} -PversionName=1.0.${{ steps.version.outputs.code }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-store-tablet-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish in-app update
        env:
          ANDROID_VERSION: ${{ steps.version.outputs.code }}
        run: |
          mkdir -p /tmp/android-update
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/android-update/simple-store-tablet.apk
          python3 - <<'PY'
          import json, os
          version=int(os.environ['ANDROID_VERSION'])
          data={'versionCode':version,'versionName':'1.0.'+str(version),'apkUrl':'https://ksddrcalmszxxcuxoznd.supabase.co/functions/v1/android-update-proxy?file=apk&v='+str(version),'apkUrlFallback':'https://raw.githubusercontent.com/ms0583212599-debug/simple-store-app/main/updates/simple-store-tablet.apk?v='+str(version)}
          with open('/tmp/android-update/version.json','w',encoding='utf-8') as f:json.dump(data,f,ensure_ascii=False,separators=(',',':'));f.write('\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p updates
            cp /tmp/android-update/simple-store-tablet.apk updates/simple-store-tablet.apk
            cp /tmp/android-update/version.json updates/version.json
            git add updates/simple-store-tablet.apk updates/version.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Publish Android update ${ANDROID_VERSION}"
            if git push origin HEAD:main; then exit 0; fi
            echo "main changed during publish; retrying on latest main ($attempt/5)"
          done
          exit 1
