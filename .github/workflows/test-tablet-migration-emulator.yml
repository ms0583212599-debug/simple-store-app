name: Test tablet migration on disposable Android 13 emulator
on:
  push:
    branches: ['diagnostics/tablet-owner-readonly']
    paths:
      - 'diagnostics/EmulatorOwnerRelease.java'
      - 'diagnostics/test_emulator_migration.py'
      - '.github/workflows/test-tablet-migration-emulator.yml'
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch existing new-signature APK without signing secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37440521486 --repo "$GITHUB_REPOSITORY" --name simple-store-tablet-apk --dir new-apk
      - name: Compile emulator-only fixture
        run: |
          set -euo pipefail
          mkdir -p probe-classes probe-output
          javac --release 8 -d probe-classes diagnostics/EmulatorOwnerRelease.java
          jar cf probe-input.jar -C probe-classes .
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/d8" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
          fi
          "$ANDROID_HOME/build-tools/35.0.0/d8" --min-api 33 --output probe-output/emulator-owner-release.jar probe-input.jar
      - name: Enable KVM on disposable runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise synthetic migration without launching store app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 diagnostics/test_emulator_migration.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: synthetic-migration-result
          path: migration-result.json
          if-no-files-found: error
