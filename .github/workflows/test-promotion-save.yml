name: Test promotion persistence
on:
  push:
    branches: [fix/promotion-save]
permissions:
  contents: read
jobs:
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/admin-ui" --no-save playwright@1.51.1
      - run: '"$RUNNER_TEMP/admin-ui/node_modules/.bin/playwright" install --with-deps chromium'
      - run: NODE_PATH="$RUNNER_TEMP/admin-ui/node_modules" node tests/quantity-promotions.cjs
