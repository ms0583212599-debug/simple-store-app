plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simplestore.tablet'
    compileSdk 35

    signingConfigs {
        debug {
            storeFile = new File(System.getProperty('user.home'), '.android/release.keystore')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS')
            keyPassword System.getenv('ANDROID_KEY_PASSWORD')
        }
    }

    defaultConfig {
        applicationId 'com.simplestore.tablet'
        minSdk 23
        targetSdk 35
        versionCode = Integer.parseInt((project.findProperty('versionCode') ?: '1').toString())
        versionName = (project.findProperty('versionName') ?: '1.0').toString()
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
